name: Publish
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v**

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    uses: tryAGI/workflows/.github/workflows/dotnet-sdk-build-test-publish.yml@main
    with:
      enable-caching: false
      publish: true
      run-tests: true
      additional-test-arguments: '--logger GitHubActions'
    secrets:
      nuget-key: ${{ secrets.NUGET_KEY }}

  trim-check:
    name: Trimming Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Add linker swap for the full Apple schema
        run: |
          swapon --show
          df -h /mnt
          sudo fallocate -l 8G /mnt/autosdk-trim.swap
          sudo chmod 600 /mnt/autosdk-trim.swap
          sudo mkswap /mnt/autosdk-trim.swap
          sudo swapon /mnt/autosdk-trim.swap
          free -h

      - name: Install AutoSDK CLI
        run: dotnet tool install --global autosdk.cli --prerelease

      - name: Run full trimming check
        run: autosdk trim src/libs/AppStoreConnect/AppStoreConnect.csproj

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [publish, trim-check]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release
        run: gh release create ${{ github.ref_name }}
          --title "${{ github.ref_name }}"
          --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
